name: Build Game EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Odbierz kod z repozytorium
      uses: actions/checkout@v4

    - name: Skonfiguruj MinGW (g++)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: git mingw-w64-ucrt-x86_64-gcc

    - name: Kompilacja gry do pliku EXE
      shell: msys2 {0}
      run: |
        g++ -std=c++17 -O2 pergaminy_z_rennes.cpp -o pergaminy_gra.exe -lgdi32 -static

    - name: Zapisz plik EXE jako artefakt (do pobrania)
      uses: actions/upload-artifact@v4
      with:
        name: pergaminy-gra-exe
        path: pergaminy_gra.exe
